<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journaux</title><style>
:root{--bg:#f5f6f8;--c:#fff;--t:#1b1f24;--a:#1a6dff;--m:#667}@media(prefers-color-scheme:dark){:root{--bg:#14161a;--c:#1f2328;--t:#e8eaed;--m:#99a}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:var(--bg);color:var(--t);padding:12px 12px 74px}
.card{background:var(--c);border-radius:12px;padding:12px;margin:10px 0}input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #8884;background:var(--c);color:var(--t);width:100%;margin:4px 0}
button{background:var(--a);color:#fff;border:0}button.s{background:#8883;color:var(--t);width:auto;padding:6px 10px}.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c)}nav button{background:none;color:var(--t);border-radius:0;font-size:14px}nav button.on{color:var(--a);font-weight:700}
small{color:var(--m)}.ok{color:#1a9a4a}.ko{color:#d33}</style></head><body><div id="v"></div><nav id="nav"></nav>
<script>
const today=()=>new Date().toISOString().slice(0,10);
const eur=n=>(+n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=JSON.parse(localStorage.getItem("db")||'{"w":[],"r":[],"d":[]}'),tab="in",month=today().slice(0,7),day=today();
const save=()=>localStorage.setItem("db",JSON.stringify(D)),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const RT={paper:"par journal",day:"par jour",week:"par semaine",month:"par mois"};
const W=id=>D.w.find(x=>x.id==id)||{name:"(supprimé)"},R=id=>D.r.find(x=>x.id==id)||{name:"(supprimée)"};
function wk(d){const t=new Date(d);t.setDate(t.getDate()-((t.getDay()+6)%7));return t.toISOString().slice(0,10)}
function pay(w,ds){if(!ds.length)return 0;const n=ds.reduce((a,x)=>a+x.count,0);
 if(w.rt=="paper")return n*w.rate;if(w.rt=="day")return new Set(ds.map(x=>x.day)).size*w.rate;
 if(w.rt=="week")return new Set(ds.map(x=>wk(x.day))).size*w.rate;return +w.rate}
const inM=(m,wid)=>D.d.filter(x=>x.day.startsWith(m)&&(!wid||x.w==wid));
function draw(){nav.innerHTML=[["in","Saisie"],["team","Équipe"],["rt","Tournées"],["rent","Rentabilité"],["more","Plus"]].map(t=>`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join("");V[tab]();scrollTo(0,0)}
const V={
in(){if(!D.w.length||!D.r.length){v.innerHTML=`<div class=card>Commencez par créer au moins <b>un salarié</b> (onglet Équipe) et <b>une tournée</b> (onglet Tournées).</div>`;return}
 const last=D.d.slice().sort((a,b)=>b.day.localeCompare(a.day)).slice(0,15);
 v.innerHTML=`<div class=card><h3>Journaux livrés</h3><select id=sw>${D.w.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join("")}</select><input type=date id=dt value="${day}">
 <small>Nombre de journaux par tournée faite :</small>${D.r.map(r=>`<div class=r><span>${esc(r.name)}</span><input type=number min=0 inputmode=numeric placeholder="0" data-r="${r.id}"></div>`).join("")}<button onclick="add()">Enregistrer</button></div>
 <h3>Dernières saisies</h3>`+last.map(x=>`<div class=card>${x.day} — <b>${esc(W(x.w).name)}</b><br>${esc(R(x.r).name)} : <b>${x.count}</b> journaux <button class=s onclick="delD('${x.id}')">Supprimer</button></div>`).join("")},
team(){v.innerHTML=`<h3>Équipe</h3>`+D.w.map(w=>`<div class=card><b>${esc(w.name)}</b><br><small>${RT[w.rt]} : ${eur(w.rate)}</small><br><button class=s onclick="eW('${w.id}')">Modifier</button> <button class=s onclick="dW('${w.id}')">Supprimer</button></div>`).join("")+`<button onclick="eW()">+ Salarié</button>`},
rt(){v.innerHTML=`<h3>Tournées (coûts par mois)</h3>`+D.r.map(r=>`<div class=card><b>${esc(r.name)}</b><br><small>Prix/journal ${eur(r.pp)} · forfait ${eur(r.flat)}<br>Gasoil ${eur(r.fuel)} · Impôts ${eur(r.tax)} · Véhicule ${eur(r.veh)} · Autres ${eur(r.oth)}</small><br><button class=s onclick="eR('${r.id}')">Modifier</button> <button class=s onclick="dR('${r.id}')">Supprimer</button></div>`).join("")+`<button onclick="eR()">+ Tournée</button>`},
rent(){const ds=inM(month),pw={};D.w.forEach(w=>{const m=ds.filter(x=>x.w==w.id),t=m.reduce((a,x)=>a+x.count,0),P=pay(w,m);m.forEach(x=>pw[x.r]=(pw[x.r]||0)+(t?P*x.count/t:0))});
 let T=0;const rows=D.r.map(r=>{const n=ds.filter(x=>x.r==r.id).reduce((a,x)=>a+x.count,0),rev=n*r.pp+ +r.flat,cost=+r.fuel+ +r.tax+ +r.veh+ +r.oth,sal=pw[r.id]||0,pr=rev-cost-sal;T+=pr;
 return `<div class=card><b>${esc(r.name)}</b> — ${n} journaux<br>Revenus ${eur(rev)}<br>Salaires ${eur(sal)} · Coûts ${eur(cost)}<br><b class="${pr<0?"ko":"ok"}">Résultat ${eur(pr)}</b></div>`}).join("");
 const sal=D.w.map(w=>{const m=ds.filter(x=>x.w==w.id);return `<div class=r><span>${esc(w.name)} <small>(${m.reduce((a,x)=>a+x.count,0)} j.)</small></span><b>${eur(pay(w,m))}</b></div>`}).join("");
 v.innerHTML=`<input type=month value="${month}" onchange="month=this.value;V.rent()"><h3>Résultat total : <span class="${T<0?"ko":"ok"}">${eur(T)}</span></h3>${rows}<div class=card><b>Paie du mois</b>${sal}</div>`},
more(){v.innerHTML=`<div class=card><h3>Sauvegarde</h3><small>Copiez vos données et collez-les dans une note pour les garder. Utile avant de changer de téléphone.</small><button onclick="bk()">Copier mes données</button><button class=s onclick="rs()">Restaurer depuis une copie</button></div>`}};
function add(){const rows=[...document.querySelectorAll("[data-r]")].filter(i=>+i.value>0);if(!rows.length)return alert("Indiquez au moins une tournée");
 day=dt.value;rows.forEach(i=>D.d.push({id:uid(),w:sw.value,r:i.dataset.r,day:dt.value,count:+i.value}));save();draw()}
function delD(id){if(confirm("Supprimer cette saisie ?")){D.d=D.d.filter(x=>x.id!=id);save();draw()}}
function eW(id){const w=D.w.find(x=>x.id==id)||{},nm=prompt("Nom du salarié",w.name||"");if(!nm)return;
 let rt=prompt("Type de paie : paper (par journal), day (par jour), week (par semaine), month (par mois)",w.rt||"paper");if(!RT[rt])rt="paper";
 const rate=+prompt("Tarif en € ("+RT[rt]+")",w.rate||0)||0;if(id)Object.assign(w,{name:nm,rt,rate});else D.w.push({id:uid(),name:nm,rt,rate});save();draw()}
function dW(id){if(confirm("Supprimer ce salarié et ses saisies ?")){D.w=D.w.filter(x=>x.id!=id);D.d=D.d.filter(x=>x.w!=id);save();draw()}}
function eR(id){const r=D.r.find(x=>x.id==id)||{},nm=prompt("Nom de la tournée",r.name||"");if(!nm)return;const g=(l,k)=>+prompt(l,r[k]||0)||0;
 const o={name:nm,pp:g("Prix facturé par journal (€)","pp"),flat:g("Forfait mensuel facturé (€)","flat"),fuel:g("Gasoil par mois (€)","fuel"),tax:g("Impôts et cotisations par mois (€)","tax"),veh:g("Véhicule, entretien, assurance par mois (€)","veh"),oth:g("Autres coûts par mois (€)","oth")};
 if(id)Object.assign(r,o);else D.r.push({id:uid(),...o});save();draw()}
function dR(id){if(confirm("Supprimer cette tournée et ses saisies ?")){D.r=D.r.filter(x=>x.id!=id);D.d=D.d.filter(x=>x.r!=id);save();draw()}}
function bk(){const t=JSON.stringify(D);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert("Données copiées. Collez-les dans une note."),()=>prompt("Copiez ce texte :",t))}
function rs(){const t=prompt("Collez ici vos données copiées");if(!t)return;try{const o=JSON.parse(t);if(!o.w||!o.r||!o.d)throw 0;D=o;save();draw();alert("Données restaurées")}catch(e){alert("Données invalides")}}
draw()
</script></body></html>
