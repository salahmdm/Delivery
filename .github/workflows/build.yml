name: Build TelecommandeWifi APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already includes Android SDK command-line tools.
      # Avoid android-actions/setup-android@v3 which may request obsolete 'tools'.
      - name: Install Android platform 35
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelecommandeWifi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
