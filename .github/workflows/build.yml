name: Build TelecommandeWifi APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compiler APK debug
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle.kts ]; then
            gradle :app:assembleDebug --no-daemon --stacktrace
          elif [ -f TelecommandeWifi/app/build.gradle.kts ]; then
            cd TelecommandeWifi
            gradle :app:assembleDebug --no-daemon --stacktrace
          else
            echo 'Projet Android introuvable : app/build.gradle.kts absent.' >&2
            exit 1
          fi

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: TelecommandeWifi-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            TelecommandeWifi/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
