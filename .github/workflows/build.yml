name: Build APK Remote Sharp

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les outils Android du projet
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Trouver le projet Remote Sharp
        shell: bash
        run: |
          set -euo pipefail
          projets=()

          while IFS= read -r -d '' wrapper; do
            dossier=$(dirname "$wrapper")
            if [[ -f "$dossier/settings.gradle.kts" &&
                  -f "$dossier/app/src/main/java/fr/remote/sharp/EventListener.java" ]]; then
              projets+=("$dossier")
            fi
          done < <(find . -name .git -prune -o -type f -name gradlew -print0)

          if [[ ${#projets[@]} -ne 1 ]]; then
            echo "::error::Nombre de projets Remote Sharp avec le mode écoute trouvés : ${#projets[@]}. Il en faut un. Vérifie que les sources 0.1.14 sont décompressées dans le dépôt."
            exit 1
          fi

          echo "PROJ=${projets[0]}" >> "$GITHUB_ENV"
          echo "Projet trouvé dans ${projets[0]}"

      - name: Compiler l’APK
        working-directory: ${{ env.PROJ }}
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: Remote-Sharp-0.1.14-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
