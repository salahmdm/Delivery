name: Build APK Remote Sharp

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compiler Remote Sharp avec le mode écoute
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Trouver les sources Remote Sharp
        shell: bash
        run: |
          set -euo pipefail

          chercher_projet() {
            local racine="$1"
            local wrapper dossier
            while IFS= read -r -d '' wrapper; do
              dossier="$(dirname "$wrapper")"
              if [[ -f "$dossier/settings.gradle.kts" &&
                    -f "$dossier/app/build.gradle.kts" &&
                    -f "$dossier/app/src/main/java/fr/remote/sharp/EventListener.java" ]]; then
                printf '%s\n' "$dossier"
                return 0
              fi
            done < <(find "$racine" -name .git -prune -o -type f -name gradlew -print0)
            return 1
          }

          # Cas 1 : les sources sont déjà décompressées dans le dépôt.
          if projet="$(chercher_projet "$GITHUB_WORKSPACE")"; then
            echo "Projet trouvé dans le dépôt : $projet"
            echo "PROJ=$projet" >> "$GITHUB_ENV"
            exit 0
          fi

          # Cas 2 : les sources se trouvent dans une archive ZIP.
          nombre_zip=0
          while IFS= read -r -d '' archive; do
            nombre_zip=$((nombre_zip + 1))
            echo "Archive examinée : ${archive#"$GITHUB_WORKSPACE"/}"

            # Seules les archives contenant le mode écoute sont extraites.
            if ! unzip -Z1 "$archive" > "$RUNNER_TEMP/remote-sharp-contenu.txt"; then
              echo "::warning::Archive ZIP illisible : $archive"
              continue
            fi
            if ! grep -Eq '(^|/)app/src/main/java/fr/remote/sharp/EventListener\.java$' \
                "$RUNNER_TEMP/remote-sharp-contenu.txt"; then
              echo "Mode écoute absent de cette archive."
              continue
            fi

            destination="$(mktemp -d "$RUNNER_TEMP/remote-sharp.XXXXXX")"
            unzip -q "$archive" -d "$destination"
            if projet="$(chercher_projet "$destination")"; then
              echo "Projet sélectionné depuis : ${archive#"$GITHUB_WORKSPACE"/}"
              echo "PROJ=$projet" >> "$GITHUB_ENV"
              exit 0
            fi
          done < <(find "$GITHUB_WORKSPACE" -name .git -prune -o \
                    -type f -iname '*.zip' -print0)

          if [[ "$nombre_zip" -eq 0 ]]; then
            echo "::error::Cette branche ne contient ni ZIP ni projet décompressé avec EventListener.java. Ajoute le ZIP des sources 0.1.14 sur cette même branche."
          else
            echo "::error::Aucun des $nombre_zip ZIP examinés ne contient le projet complet avec le mode écoute. Vérifie que tu as envoyé le ZIP produit par le générateur 0.1.14."
          fi
          exit 1

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;37.0.0'

      - name: Compiler l’APK
        working-directory: ${{ env.PROJ }}
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: Remote-Sharp-0.1.14-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
