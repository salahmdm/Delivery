name: Build TelecommandeWifi APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Trouver ou extraire le projet Android
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          root = Path(os.environ['GITHUB_WORKSPACE'])
          candidates = sorted(root.rglob('app/build.gradle.kts'))
          if not candidates:
              archives = sorted(root.rglob('TelecommandeWifi-source.zip'))
              if len(archives) != 1:
                  raise SystemExit('Projet introuvable. Ajoute TelecommandeWifi-source.zip au depot, ou decompresse son contenu.')
              dest = Path(os.environ['RUNNER_TEMP']) / 'telecommande-extracted'
              dest.mkdir(parents=True, exist_ok=True)
              with ZipFile(archives[0]) as z:
                  for item in z.infolist():
                      target = (dest / item.filename).resolve()
                      if not target.is_relative_to(dest.resolve()):
                          raise SystemExit('Archive ZIP invalide : chemin non autorise')
                  z.extractall(dest)
              candidates = sorted(dest.rglob('app/build.gradle.kts'))
          projects = [p.parent.parent for p in candidates if (p.parent.parent / 'settings.gradle.kts').is_file()]
          if len(projects) != 1:
              raise SystemExit(f'Un seul projet Android attendu, trouves : {len(projects)}')
          project = projects[0]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              print(f'ANDROID_PROJECT_DIR={project}', file=f)
          print(f'Projet Android trouve : {project}')
          PY

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compiler APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: TelecommandeWifi-debug-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
