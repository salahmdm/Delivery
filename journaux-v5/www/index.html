<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Journaux</title><style>
:root{--bg:#eef1f5;--c:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--a:#1d4ed8;--g:#15803d;--r:#dc2626;--ink:#0f172a;--gs:#dcfce7;--rs:#fee2e2}
@media(prefers-color-scheme:dark){:root{--bg:#0b1018;--c:#151c28;--t:#e8edf5;--m:#8b9ab0;--b:#263042;--a:#6a9bff;--g:#4ade80;--r:#f87171;--ink:#1e293b;--gs:#12351f;--rs:#3b1717}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font:16px/1.4 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);padding-bottom:96px}
header{padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 4px;display:flex;justify-content:space-between;align-items:center}header b{font-size:22px;letter-spacing:-.4px}

button{font:inherit;cursor:pointer}.btn{width:100%;padding:15px;border:0;border-radius:14px;background:var(--a);color:#fff;font-weight:700;margin-top:10px}.btn.s{background:var(--b);color:var(--t)}.btn.v{background:var(--g);color:#fff}.btn.k{background:var(--r);color:#fff}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}.sp>div:first-child{min-width:0}
small,.m{color:var(--m);font-size:13px}.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700}.pill.ok{background:var(--gs);color:var(--g)}.pill.ko{background:var(--rs);color:var(--r)}

.ent{display:flex;gap:12px;align-items:center}.ent>div:nth-child(2){flex:1;min-width:0}.big{font-size:22px;font-weight:800}
.bars{display:flex;gap:8px;align-items:flex-end;height:96px;margin-top:6px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--m)}.bars i{display:block;background:var(--a);border-radius:6px 6px 2px 2px;min-height:3px;margin-bottom:4px}
.warn{background:var(--a);color:#fff;border-radius:16px;padding:14px;margin:12px 0;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);align-items:center}
nav button{flex:1;background:none;border:0;color:var(--m);font-size:12px;padding:4px 0}nav button span{display:block;font-size:22px}nav button.on{color:var(--a);font-weight:700}
nav .fab{flex:none;width:58px;height:58px;border-radius:50%;background:var(--a);color:#fff;font-size:32px;margin:-30px 6px 0;box-shadow:0 6px 16px #0004}
.bg{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}.sh{background:var(--c);width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}.sh h2{margin:0 0 4px}
label{display:block;font-size:13px;font-weight:600;color:var(--m);margin:14px 0 6px}
input,select{font:inherit;width:100%;padding:13px;border-radius:12px;border:1px solid var(--b);background:var(--bg);color:var(--t)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:10px 16px;border-radius:99px;background:var(--bg);border:1px solid var(--b);color:var(--t)}.chip.on{background:var(--a);border-color:var(--a);color:#fff;font-weight:700}
.st{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--b)}.st b{flex:1}.st .q{display:flex;gap:6px;align-items:center}
.q button{width:42px;height:42px;border-radius:12px;border:0;background:var(--b);color:var(--t);font-size:20px;font-weight:700}.q input{width:64px;text-align:center;font-weight:700;padding:10px 4px}
.empty{text-align:center;padding:30px 16px;color:var(--m)}.empty h2{color:var(--t);margin:6px 0}.hi{font-size:46px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;z-index:20;font-weight:600}
.hero2{text-align:center;padding:90px 22px}.hero2 h1{font-size:34px;letter-spacing:-1px;margin:8px 0}.hero2 p{color:var(--m)}
</style></head><body><div id="app"></div><nav id="nav"></nav><div id="m"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>(+n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}),eur2=n=>(+n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date()),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const fmt=d=>new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sv=()=>{localStorage.setItem("db",JSON.stringify(D));localStorage.setItem("prof",JSON.stringify(P))};
let D=ld("db",{w:[],r:[],d:[]}),P=ld("prof",{mode:"",name:"",d:[],sent:[]}),tab="home",month=today().slice(0,7),A={};
const RT={paper:"par journal",day:"par jour",week:"par semaine",month:"par mois"},RO=Object.entries(RT);
const W=id=>D.w.find(x=>x.id==id)||{name:"?"},R=id=>D.r.find(x=>x.id==id)||{name:"?"};
const toast=t=>{const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)};
const av=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `<i class=av style="background:hsl(${h} 55% 42%)">${esc((n.trim()[0]||"?").toUpperCase())}</i>`};
const chip=(l,on,f)=>`<button class="chip ${on?"on":""}" onclick="${f}">${esc(l)}</button>`;
const wk=d=>{const t=new Date(d);t.setDate(t.getDate()-((t.getDay()+6)%7));return t.toISOString().slice(0,10)};
function pay(w,ds){if(!ds.length)return 0;const n=ds.reduce((a,x)=>a+x.count,0);
 if(w.rt=="paper")return n*w.rate;if(w.rt=="day")return new Set(ds.map(x=>x.day)).size*w.rate;
 if(w.rt=="week")return new Set(ds.map(x=>wk(x.day))).size*w.rate;return +w.rate}
const okM=(m,wid)=>D.d.filter(x=>x.st=="ok"&&x.day.startsWith(m)&&(!wid||x.w==wid));
function stats(m){const ds=okM(m),pw={};let sal=0,N=0,rev=0,cost=0,T=0;D.w.forEach(w=>{const q=ds.filter(x=>x.w==w.id),t=q.reduce((a,x)=>a+x.count,0),p=pay(w,q);q.forEach(x=>pw[x.r]=(pw[x.r]||0)+(t?p*x.count/t:0))});
 const rows=D.r.map(r=>{const n=ds.filter(x=>x.r==r.id).reduce((a,x)=>a+x.count,0),rv=n*r.pp+ +r.flat,c=+r.fuel+ +r.tax+ +r.veh+ +r.oth,s=pw[r.id]||0,pr=rv-c-s;N+=n;rev+=rv;cost+=c;sal+=s;T+=pr;return{r,n,rv,c,s,pr}});return{T,N,rev,charges:cost+sal,rows}}
function sheet(title,F,cb,label="Enregistrer"){m.innerHTML=`<div class=bg onclick="if(event.target==this)m.innerHTML=''"><div class=sh><h2>${title}</h2>${F.map(f=>`<label>${f.l}</label>`+(f.o?`<select id=f_${f.k}>${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`:`<input id=f_${f.k} type=${f.t||"text"} ${f.t=="number"?"inputmode=decimal step=any":""} value="${esc(f.v??"")}">`)).join("")}<button class=btn id=go>${label}</button><button class="btn s" onclick="m.innerHTML=''">Annuler</button></div></div>`;
 $("#go").onclick=()=>{const o={};F.forEach(f=>o[f.k]=$("#f_"+f.k).value);if(cb(o)!==false)m.innerHTML=""}}
function draw(){if(!P.mode){nav.innerHTML="";app.innerHTML=`<div class=hero2><div class=hi>📰</div><h1>Journaux</h1><p>Livraisons, paie et rentabilité,<br>simplement.</p><button class=btn onclick="setMode('admin')">Je suis le patron</button><button class="btn s" onclick="setMode('worker')">Je suis salarié</button></div>`;return}
 const adm=P.mode=="admin",pe=D.d.filter(x=>x.st=="p").length;
 app.innerHTML=`<header><b>${adm?"Bonjour 👋":"Bonjour "+esc(P.name)}</b><button class=g onclick="more()">⚙️</button></header><main id=v></main>`;
 if(adm){const T=[["home","🏠","Accueil"],["val","✅","Valider"+(pe?" ("+pe+")":"")],0,["team","👥","Équipe"],["rt","🛣️","Tournées"]];
  nav.innerHTML=T.map(t=>t?`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';draw()"><span>${t[1]}</span>${t[2]}</button>`:`<button class=fab onclick="addD()">+</button>`).join("")}
 else{tab="dec";nav.innerHTML=`<button class=fab style="margin:-30px auto 0" onclick="decl()">+</button>`}
 V[tab]();scrollTo(0,0)}
function setMode(md){if(md=="admin"){P.mode="admin";sv();draw()}else sheet("Comment vous appelez-vous ?",[{k:"n",l:"Votre nom (le patron vous reconnaîtra)"}],o=>{if(!o.n.trim())return false;P.mode="worker";P.name=o.n.trim();sv();draw()},"Continuer")}
const mv=k=>{const d=new Date(month+"-15");d.setMonth(d.getMonth()+k);month=iso(d).slice(0,7);draw()};
const empty=(i,t,s,b)=>`<div class="card empty"><div class=hi>${i}</div><h2>${t}</h2>${s}${b?`<button class=btn onclick="${b[1]}">${b[0]}</button>`:""}</div>`;
const V={
home(){if(!D.w.length||!D.r.length){v.innerHTML=empty("🚀","Configurons votre activité","Deux étapes et c'est parti : ajoutez vos tournées, puis vos salariés.<br><br>"+(D.r.length?"✅ Tournées":"1. Créer une tournée")+" · "+(D.w.length?"✅ Salariés":"2. Ajouter un salarié"),D.r.length?["Ajouter un salarié","eW()"]:["Créer ma première tournée","eR()"]);return}
 const S=stats(month),pe=D.d.filter(x=>x.st=="p").length,ml=new Date(month+"-15").toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
 const days=[6,5,4,3,2,1,0].map(i=>ago(i)),cn=days.map(d=>D.d.filter(x=>x.day==d&&x.st!="ko").reduce((a,x)=>a+x.count,0)),mx=Math.max(1,...cn);
 v.innerHTML=`<div class=hero><div class=mo><button onclick="mv(-1)">‹</button><span>${ml}</span><button onclick="mv(1)">›</button></div><small>Résultat du mois</small><div class="huge ${S.T<0?"neg":"pos"}">${eur(S.T)}</div><div class=kp><div><b>${S.N}</b><small>journaux</small></div><div><b>${eur(S.rev)}</b><small>revenus</small></div><div><b>${eur(S.charges)}</b><small>charges</small></div></div></div>
 ${pe?`<div class=warn onclick="tab='val';draw()">📥 ${pe} déclaration${pe>1?"s":""} à valider ›</div>`:""}
 <h3>7 derniers jours</h3><div class=card><div class=bars>${cn.map((c,i)=>`<div><i style="height:${Math.round(c/mx*70)}px"></i>${c||""}<br>${["D","L","M","M","J","V","S"][new Date(days[i]+"T12:00").getDay()]}</div>`).join("")}</div></div>
 <h3>Rentabilité par tournée</h3>`+S.rows.map(x=>`<div class=card><div class=sp><b>${esc(x.r.name)}</b><span class="pill ${x.pr<0?"ko":"ok"}">${eur(x.pr)}</span></div><small>${x.n} journaux · revenus ${eur(x.rv)} · salaires ${eur(x.s)} · coûts ${eur(x.c)}</small></div>`).join("")+
 `<h3>Paie du mois</h3><div class=card>`+D.w.map(w=>{const q=okM(month,w.id);return `<div class="ent" style="margin:8px 0">${av(w.name)}<div><b>${esc(w.name)}</b><br><small>${q.reduce((a,x)=>a+x.count,0)} journaux</small></div><b class=big>${eur(pay(w,q))}</b></div>`}).join("")+`</div>`},
val(){const p=D.d.filter(x=>x.st=="p");v.innerHTML=`<button class="btn s" onclick="imp()" style="margin-top:12px">📥 Importer le code d'un salarié</button>`+(p.length?`<button class="btn v" onclick="allOk()">Tout valider (${p.length})</button>`:empty("🎉","Tout est à jour","Aucune déclaration en attente."))+p.map(x=>`<div class=card><div class=ent>${av(W(x.w).name)}<div><b>${esc(W(x.w).name)}</b><br><small>${fmt(x.day)} · ${esc(R(x.r).name)}</small></div><span class=big>${x.count}</span></div><div class=row><button class="btn v" onclick="st('${x.id}','ok')">Valider</button><button class="btn s" onclick="fix('${x.id}')">Corriger</button><button class="btn k" onclick="st('${x.id}','ko')">Refuser</button></div></div>`).join("")},
team(){v.innerHTML=(D.w.length?"":empty("👥","Aucun salarié","Ajoutez les personnes qui livrent pour vous."))+D.w.map(w=>{const q=okM(month,w.id);return `<div class=card><div class=ent>${av(w.name)}<div><b>${esc(w.name)}</b><br><small>${eur2(w.rate)} ${RT[w.rt]}</small></div><b>${eur(pay(w,q))}</b></div><div class=row><button class="btn s" onclick="eW('${w.id}')">Modifier</button><button class="btn s" onclick="dW('${w.id}')">Supprimer</button></div></div>`}).join("")+`<button class=btn onclick="eW()">+ Ajouter un salarié</button>`},
rt(){v.innerHTML=(D.r.length?"":empty("🛣️","Aucune tournée","Une tournée = un parcours de livraison avec ses revenus et ses coûts."))+D.r.map(r=>`<div class=card><b>${esc(r.name)}</b><br><small>Facturé ${eur2(r.pp)} par journal${r.flat?" + forfait "+eur(r.flat):""}<br>Par mois : gasoil ${eur(r.fuel)} · impôts ${eur(r.tax)} · véhicule ${eur(r.veh)} · autres ${eur(r.oth)}</small><div class=row><button class="btn s" onclick="eR('${r.id}')">Modifier</button><button class="btn s" onclick="dR('${r.id}')">Supprimer</button></div></div>`).join("")+`<button class=btn onclick="eR()">+ Ajouter une tournée</button>`},
dec(){const l=P.d.slice().sort((a,b)=>b.day.localeCompare(a.day)||0).slice(0,40),ns=P.d.filter(x=>!P.sent.includes(x.id)).length,td=P.d.filter(x=>x.day==today()).reduce((a,x)=>a+x.c,0),mo=P.d.filter(x=>x.day.startsWith(month)).reduce((a,x)=>a+x.c,0);
 v.innerHTML=`<div class=hero><small>Aujourd'hui</small><div class=huge>${td}</div><div class=kp><div><b>${mo}</b><small>ce mois-ci</small></div><div><b>${P.d.length}</b><small>déclarations</small></div></div></div>
 ${ns?`<div class=card><b>${ns} déclaration${ns>1?"s":""} pas encore envoyée${ns>1?"s":""}</b><br><small>Envoyez-les au patron pour qu'il les valide.</small><button class=btn onclick="send()">📤 Envoyer au patron</button></div>`:P.d.length?`<div class=card>✅ Tout est envoyé au patron.</div>`:""}
 ${P.d.length?"<h3>Mes déclarations</h3>":empty("📦","Rien déclaré","Touchez le bouton + pour déclarer vos journaux livrés.")}`+l.map(x=>`<div class=card><div class=sp><div><b>${x.c} journaux</b> · ${esc(x.r)}<br><small>${fmt(x.day)} ${P.sent.includes(x.id)?"· envoyé":"· à envoyer"}</small></div><button class="btn s" style="width:auto;margin:0" onclick="delP('${x.id}')">🗑</button></div></div>`).join("")}};
const steps=(id,v)=>`<div class=st><b>${esc(R(id).name)}</b><div class=q><button onclick="bump('${id}',-1)">−</button><input type=number inputmode=numeric value="${v||0}" oninput="A.c['${id}']=+this.value||0"><button onclick="bump('${id}',1)">+</button><button onclick="bump('${id}',10)" style="width:52px;font-size:15px">+10</button></div></div>`;
function bump(id,n){A.c[id]=Math.max(0,(A.c[id]||0)+n);rAdd()}
function addD(){if(!D.w.length||!D.r.length){toast("Créez d'abord une tournée et un salarié");return}A={w:A.w||D.w[0].id,d:today(),c:{}};rAdd()}
function rAdd(){m.innerHTML=`<div class=bg onclick="if(event.target==this)m.innerHTML=''"><div class=sh><h2>Saisir des journaux</h2><label>Qui a livré ?</label><div class=chips>${D.w.map(w=>chip(w.name,A.w==w.id,`A.w='${w.id}';rAdd()`)).join("")}</div><label>Quel jour ?</label><div class=chips>${chip("Aujourd'hui",A.d==today(),"A.d=today();rAdd()")}${chip("Hier",A.d==ago(1),"A.d=ago(1);rAdd()")}<input type=date value="${A.d}" onchange="A.d=this.value;rAdd()" style="width:auto"></div><label>Combien de journaux par tournée ?</label>${D.r.map(r=>steps(r.id,A.c[r.id])).join("")}<button class=btn onclick="saveD()">Enregistrer</button><button class="btn s" onclick="m.innerHTML=''">Annuler</button></div></div>`}
function saveD(){const rs=D.r.filter(r=>A.c[r.id]>0);if(!rs.length)return toast("Indiquez au moins une tournée");rs.forEach(r=>D.d.push({id:uid(),w:A.w,r:r.id,day:A.d,count:A.c[r.id],st:"ok"}));sv();m.innerHTML="";draw();toast("Enregistré ✓")}
function decl(){A={r:(P.d.slice(-1)[0]||{}).r||"",d:today(),n:0};rDecl()}
function rDecl(){const rs=[...new Set(P.d.map(x=>x.r))];m.innerHTML=`<div class=bg onclick="if(event.target==this)m.innerHTML=''"><div class=sh><h2>Déclarer mes journaux</h2><label>Tournée</label>${rs.length?`<div class=chips>${rs.map(r=>chip(r,A.r==r,`A.r=this.textContent;rDecl()`)).join("")}</div>`:""}<input id=rn placeholder="${rs.length?"Autre tournée…":"Nom de la tournée"}" value="${rs.includes(A.r)?"":esc(A.r)}" oninput="A.r=this.value"><label>Quel jour ?</label><div class=chips>${chip("Aujourd'hui",A.d==today(),"A.d=today();rDecl()")}${chip("Hier",A.d==ago(1),"A.d=ago(1);rDecl()")}</div><label>Journaux livrés</label><div class=st><b></b><div class=q><button onclick="A.n=Math.max(0,A.n-1);rDecl()">−</button><input type=number inputmode=numeric value="${A.n}" oninput="A.n=+this.value||0"><button onclick="A.n++;rDecl()">+</button><button onclick="A.n+=10;rDecl()" style="width:52px;font-size:15px">+10</button></div></div><button class=btn onclick="saveP()">Enregistrer</button><button class="btn s" onclick="m.innerHTML=''">Annuler</button></div></div>`}
function saveP(){if(!A.r.trim()||!(A.n>0))return toast("Tournée et nombre obligatoires");P.d.push({id:uid(),day:A.d,r:A.r.trim(),c:A.n});sv();m.innerHTML="";draw();toast("Déclaré ✓")}
const cp=t=>navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast("Copié ✓"),()=>prompt("Copiez :",t)):prompt("Copiez :",t);
function send(){const j=JSON.stringify({n:P.name,d:P.d.slice(-300).map(x=>({i:x.id,day:x.day,r:x.r,c:x.c}))}),msg="Mes déclarations de livraison :\nJRN1:"+btoa(unescape(encodeURIComponent(j))),done=()=>{P.sent=P.d.map(x=>x.id);sv();draw()};
 navigator.share?navigator.share({text:msg}).then(done).catch(()=>{}):(cp(msg),done())}
function imp(){sheet("Importer des déclarations",[{k:"c",l:"Collez ici le message reçu du salarié"}],o=>{const mt=o.c.match(/JRN1:([A-Za-z0-9+\/=]+)/);if(!mt){toast("Code non reconnu");return false}
 try{const j=JSON.parse(decodeURIComponent(escape(atob(mt[1])))),low=s=>s.trim().toLowerCase();let w=D.w.find(x=>low(x.name)==low(j.n));if(!w){w={id:uid(),name:j.n,rt:"paper",rate:0};D.w.push(w)}
 let n=0;j.d.forEach(x=>{if(D.d.some(y=>y.id==x.i))return;let r=D.r.find(y=>low(y.name)==low(x.r));if(!r){r={id:uid(),name:x.r.trim(),pp:0,flat:0,fuel:0,tax:0,veh:0,oth:0};D.r.push(r)}D.d.push({id:x.i,w:w.id,r:r.id,day:x.day,count:x.c,st:"p"});n++});
 sv();draw();toast(n+" déclaration(s) de "+j.n)}catch(e){toast("Code illisible");return false}},"Importer")}
