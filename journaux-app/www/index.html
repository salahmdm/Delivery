<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journaux</title><style>
:root{--bg:#f5f6f8;--c:#fff;--t:#1b1f24;--a:#1a6dff;--m:#667}@media(prefers-color-scheme:dark){:root{--bg:#14161a;--c:#1f2328;--t:#e8eaed;--m:#99a}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:var(--bg);color:var(--t);padding:12px 12px 70px}
.card{background:var(--c);border-radius:12px;padding:12px;margin:10px 0}input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #8884;background:var(--c);color:var(--t);width:100%;margin:4px 0}
button{background:var(--a);color:#fff;border:0}button.s{background:#8883;color:var(--t);width:auto;padding:6px 10px}.r{display:flex;gap:8px;align-items:center}.r>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c)}nav button{background:none;color:var(--t);border-radius:0}nav button.on{color:var(--a);font-weight:700}
small{color:var(--m)}.ok{color:#1a9a4a}.ko{color:#d33}.wa{color:#c80}</style></head><body><div id="app"></div>
<script>
const URL_="https://VOTRE-PROJET.supabase.co",KEY="VOTRE_CLE_ANON";
const api=(p,o={})=>fetch(URL_+"/rest/v1/"+p,{...o,headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation"}}).then(r=>r.json());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>(+n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const today=()=>new Date().toISOString().slice(0,10);
let me=null,S={w:[],r:[],d:[]},tab="val",month=today().slice(0,7);
const RT={paper:"par journal",day:"par jour",week:"par semaine",month:"par mois"};
async function load(){[S.w,S.r,S.d]=await Promise.all([api("workers?order=name"),api("routes?order=name"),api("declarations?order=day.desc&limit=3000")])}
const W=id=>S.w.find(x=>x.id==id)||{name:"?"},R=id=>S.r.find(x=>x.id==id)||{name:"?"};
function wk(d){const t=new Date(d);t.setDate(t.getDate()-((t.getDay()+6)%7));return t.toISOString().slice(0,10)}
function pay(w,ds){if(!ds.length)return 0;const n=ds.reduce((a,x)=>a+x.count,0);
 if(w.rate_type=="paper")return n*w.rate;
 if(w.rate_type=="day")return new Set(ds.map(x=>x.day)).size*w.rate;
 if(w.rate_type=="week")return new Set(ds.map(x=>wk(x.day))).size*w.rate;return +w.rate}
const valid=(m,wid)=>S.d.filter(x=>x.status=="ok"&&x.day.startsWith(m)&&(!wid||x.worker_id==wid));
function login(){app.innerHTML=`<div class=card><h2>Connexion</h2><input id=n placeholder="Nom"><input id=p type=password inputmode=numeric placeholder="Code PIN"><button onclick="go()">Entrer</button><small id=e></small></div>`}
async function go(){const u=await api(`workers?name=eq.${encodeURIComponent(n.value.trim())}&pin=eq.${encodeURIComponent(p.value)}`);
 if(!u[0])return e.textContent="Identifiants incorrects";me=u[0];tab=me.role=="admin"?"val":"dec";await load();draw()}
function draw(){const adm=me.role=="admin";const tabs=adm?[["val","Valider"],["team","Équipe"],["rt","Tournées"],["rent","Rentabilité"]]:[["dec","Déclarer"],["hist","Historique"]];
 app.innerHTML=`<div class=r><b>${esc(me.name)}</b><button class=s onclick="me=null;login()">Quitter</button></div><div id=v></div><nav>${tabs.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join("")}</nav>`;V[tab]()}
const st=s=>s=="ok"?'<span class=ok>validé</span>':s=="ko"?'<span class=ko>refusé</span>':'<span class=wa>en attente</span>';
const V={
dec(){v.innerHTML=`<div class=card><h3>Déclarer mes journaux</h3><input type=date id=dt value="${today()}">
${S.r.map(r=>`<div class=r><span>${esc(r.name)}</span><input type=number min=0 inputmode=numeric placeholder="0" data-r="${r.id}"></div>`).join("")}
<input id=nt placeholder="Commentaire (optionnel)"><button onclick="send()">Envoyer</button></div>`},
hist(){const m=valid(month,me.id),mine=S.d.filter(x=>x.worker_id==me.id).slice(0,60);
 v.innerHTML=`<div class=card>Mois ${month}<br><b>Gain validé : ${eur(pay(me,m))}</b> <small>(${RT[me.rate_type]} : ${eur(me.rate)})</small></div>`+mine.map(x=>`<div class=card>${x.day} — ${esc(R(x.route_id).name)}<br><b>${x.count}</b> journaux ${st(x.status)}</div>`).join("")},
val(){const p=S.d.filter(x=>x.status=="pending");v.innerHTML=`<h3>À valider (${p.length})</h3>`+p.map(x=>`<div class=card><b>${esc(W(x.worker_id).name)}</b> — ${x.day}<br>${esc(R(x.route_id).name)} : <b>${x.count}</b> journaux<br><small>${esc(x.note||"")}</small>
<div class=r><button onclick="setS('${x.id}','ok')">Valider</button><button class=s onclick="edit('${x.id}')">Corriger</button><button class=s onclick="setS('${x.id}','ko')">Refuser</button></div></div>`).join("")},
team(){v.innerHTML=`<h3>Équipe</h3>`+S.w.map(w=>`<div class=card><b>${esc(w.name)}</b> (${w.role})<br><small>${RT[w.rate_type]} : ${eur(w.rate)}</small><br><button class=s onclick="editW('${w.id}')">Modifier</button></div>`).join("")+`<button onclick="editW()">+ Salarié</button>`},
rt(){v.innerHTML=`<h3>Tournées (coûts mensuels)</h3>`+S.r.map(r=>`<div class=card><b>${esc(r.name)}</b><br><small>Prix/journal ${eur(r.price_per_paper)} · forfait ${eur(r.flat_month)}<br>Gasoil ${eur(r.fuel)} · Impôts ${eur(r.taxes)} · Véhicule ${eur(r.vehicle)} · Autres ${eur(r.other)}</small><br><button class=s onclick="editR('${r.id}')">Modifier</button></div>`).join("")+`<button onclick="editR()">+ Tournée</button>`},
rent(){const ds=valid(month),pw={};S.w.forEach(w=>{const mine=ds.filter(x=>x.worker_id==w.id),tot=mine.reduce((a,x)=>a+x.count,0),P=pay(w,mine);mine.forEach(x=>pw[x.route_id]=(pw[x.route_id]||0)+(tot?P*x.count/tot:0))});
 let T=0;const rows=S.r.map(r=>{const n=ds.filter(x=>x.route_id==r.id).reduce((a,x)=>a+x.count,0),rev=n*r.price_per_paper+ +r.flat_month,cost=+r.fuel+ +r.taxes+ +r.vehicle+ +r.other,sal=pw[r.id]||0,pr=rev-cost-sal;T+=pr;
 return `<div class=card><b>${esc(r.name)}</b> — ${n} journaux<br>Revenus ${eur(rev)}<br>Salaires ${eur(sal)} · Coûts ${eur(cost)}<br><b class="${pr<0?"ko":"ok"}">Résultat ${eur(pr)}</b></div>`}).join("");
 const sal=S.w.filter(w=>w.role!="admin").map(w=>`<div class=r><span>${esc(w.name)}</span><b>${eur(pay(w,valid(month,w.id)))}</b></div>`).join("");
 v.innerHTML=`<input type=month value="${month}" onchange="month=this.value;V.rent()"><h3>Total : ${eur(T)}</h3>${rows}<div class=card><b>Paie du mois</b>${sal}</div>`}};
async function send(){const rows=[...document.querySelectorAll("[data-r]")].filter(i=>+i.value>0).map(i=>({worker_id:me.id,route_id:i.dataset.r,day:dt.value,count:+i.value,note:nt.value}));
 if(!rows.length)return alert("Indiquez au moins une tournée");await api("declarations",{method:"POST",body:JSON.stringify(rows)});await load();alert("Envoyé");tab="hist";draw()}
async function setS(id,s){await api("declarations?id=eq."+id,{method:"PATCH",body:JSON.stringify({status:s})});await load();draw()}
async function edit(id){const x=S.d.find(d=>d.id==id),n=prompt("Nombre corrigé",x.count);if(n==null)return;await api("declarations?id=eq."+id,{method:"PATCH",body:JSON.stringify({count:+n,status:"ok"})});await load();draw()}
async function editW(id){const w=S.w.find(x=>x.id==id)||{},nm=prompt("Nom",w.name||"");if(!nm)return;const pin=prompt("PIN",w.pin||""),rt=prompt("Type de paie : paper, day, week ou month",w.rate_type||"paper"),rate=prompt("Tarif (€)",w.rate||0),role=prompt("Rôle : worker ou admin",w.role||"worker");
 const b=JSON.stringify({name:nm,pin,rate_type:rt,rate:+rate,role});id?await api("workers?id=eq."+id,{method:"PATCH",body:b}):await api("workers",{method:"POST",body:b});await load();draw()}
async function editR(id){const r=S.r.find(x=>x.id==id)||{},nm=prompt("Nom de la tournée",r.name||"");if(!nm)return;const g=(l,k)=>+prompt(l,r[k]||0);
 const b=JSON.stringify({name:nm,price_per_paper:g("Prix facturé par journal (€)","price_per_paper"),flat_month:g("Forfait mensuel facturé (€)","flat_month"),fuel:g("Gasoil/mois (€)","fuel"),taxes:g("Impôts & cotisations/mois (€)","taxes"),vehicle:g("Véhicule/entretien/assurance par mois (€)","vehicle"),other:g("Autres coûts/mois (€)","other")});
 id?await api("routes?id=eq."+id,{method:"PATCH",body:b}):await api("routes",{method:"POST",body:b});await load();draw()}
login()
</script></body></html>
