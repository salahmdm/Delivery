.bdg{display:inline-block;background:var(--r);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:0 6px;margin-left:4px}nav button{position:relative}.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{color:var(--m);font-weight:600;text-align:right;padding:6px 5px;white-space:nowrap}.tb td{padding:10px 5px;border-top:1px solid var(--b);text-align:right;white-space:nowrap}.tb th:first-child,.tb td:first-child{text-align:left;position:sticky;left:0;background:var(--c);max-width:92px;overflow:hidden;text-overflow:ellipsis}.tb tr.ft td{font-weight:800}.pos2{color:var(--g)}.neg2{color:var(--r)}.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}.tile{background:var(--c);border-radius:14px;padding:12px 10px}.tile b{display:block;font-size:15px}.tile small{font-size:12px}.lg{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:14px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--b)}.bxs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}.bxs.t3{grid-template-columns:1fr 1fr 1fr}.bx{background:var(--bg);border-radius:12px;padding:10px;min-width:0}.bx small{display:block;font-size:12px;margin-bottom:2px}.bx b{display:block;font-size:15px;overflow-wrap:anywhere}.bxs.t3 .bx b{font-size:13.5px}.bx.w2{grid-column:1/-1}.dp{display:inline-flex;width:28px;height:28px;border-radius:8px;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--b);color:var(--m);margin-right:4px}.dp.on{background:var(--a);color:#fff}.tg{display:inline-block;padding:4px 11px;border-radius:99px;background:var(--b);font-size:13px;margin:2px 6px 2px 0}.ttl{font-size:17px;font-weight:700}.fm{height:92vh;max-height:92vh;display:flex;flex-direction:column;padding:0;overflow:hidden}.fh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--b);font-size:17px}.fb{flex:1;overflow:auto;padding:12px 14px;background:var(--bg)}.fs{background:var(--c);border-radius:16px;padding:14px;margin-bottom:12px}.fst{font-weight:700;font-size:15px}.fl{margin-top:12px}.fl label{margin:0 0 6px}.fw{position:relative}.fw input{padding-right:86px}.fw span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--m);font-size:13.5px;pointer-events:none}.sg{display:flex;background:var(--b);border-radius:12px;padding:3px}.sg button{flex:1;margin:0;border:0;background:none;color:var(--t);padding:10px 2px;border-radius:10px;font-size:12px;line-height:1.2}.sg button.on{background:var(--c);font-weight:700;box-shadow:0 1px 3px #0003}.dys{display:flex;gap:6px}.dys button{flex:1;height:44px;border-radius:12px;border:0;background:var(--b);color:var(--m);font-weight:700;margin:0;padding:0}.dys button.on{background:var(--a);color:#fff}.ff{padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);border-top:1px solid var(--b);background:var(--c)}.ff .btn{margin-top:8px}.ff .btn:first-child{margin-top:0}.fi2{display:block;margin-top:10px;background:var(--bg);border-radius:10px;padding:8px 10px}</style></head><body><div id="app"></div><nav id="nav"></nav><div id="m"></div>
<script>const LS=(()=>{try{localStorage.setItem("_t","1");return localStorage}catch(e){const o={};return{getItem:k=>o[k]??null,setItem:(k,v)=>{o[k]=v}}}})();
function ask(t,yes){const e=document.createElement("div");e.className="bg";e.style.zIndex=30;e.innerHTML=`<div class=sh><h2 style="white-space:pre-line">${esc(t)}</h2><div class=row><button class="btn s" id=n_>Non</button><button class="btn k" id=y_>Oui</button></div></div>`;document.body.append(e);e.querySelector("#n_").onclick=()=>e.remove();e.querySelector("#y_").onclick=()=>{e.remove();yes()}}
function showTxt(t){const e=document.createElement("div");e.className="bg";e.style.zIndex=30;e.innerHTML=`<div class=sh><h2>Copiez ce texte</h2><textarea readonly style="width:100%;height:160px;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--b);background:var(--bg);color:var(--t)">${esc(t)}</textarea><button class=btn id=c_>Fermer</button></div>`;document.body.append(e);const x=e.querySelector("textarea");x.focus();x.select();e.querySelector("#c_").onclick=()=>e.remove()}

const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>(+n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"}),eur2=n=>(+n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date()),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const fmt=d=>new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const ld=(k,d)=>{try{return JSON.parse(LS.getItem(k))||d}catch(e){return d}},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sv=()=>{if(P.mode=="admin")D._ts=Date.now();LS.setItem("db",JSON.stringify(D));LS.setItem("prof",JSON.stringify(P));if(typeof syncPush=="function")syncPush()};
let D=ld("db",{w:[],r:[],d:[]}),P=ld("prof",{mode:"",name:"",d:[],sent:[]}),tab="home",month=today().slice(0,7),A={};
const RT={paper:"par journal",day:"par jour",week:"par semaine",month:"par mois"},RO=Object.entries(RT);
const W=id=>D.w.find(x=>x.id==id)||{name:"?"},R=id=>D.r.find(x=>x.id==id)||{name:"?"};
const toast=t=>{const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)};
const av=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `<i class=av style="background:hsl(${h} 55% 42%)">${esc((n.trim()[0]||"?").toUpperCase())}</i>`};
const chip=(l,on,f)=>`<button class="chip ${on?"on":""}" onclick="${f}">${esc(l)}</button>`;
const wk=d=>{const t=new Date(d);t.setDate(t.getDate()-((t.getDay()+6)%7));return t.toISOString().slice(0,10)};
function pay(w,ds){if(!ds.length)return 0;const n=ds.reduce((a,x)=>a+x.count,0);
 if(w.rt=="paper")return n*w.rate;if(w.rt=="day")return new Set(ds.map(x=>x.day)).size*w.rate;
 if(w.rt=="week")return new Set(ds.map(x=>wk(x.day))).size*w.rate;return +w.rate}
const okM=(m,wid)=>D.d.filter(x=>x.st=="ok"&&x.day.startsWith(m)&&(!wid||x.w==wid));
function stats(m){const ds=okM(m),pw={};let sal=0,N=0,rev=0,cost=0,T=0;D.w.forEach(w=>{const q=ds.filter(x=>x.w==w.id),t=q.reduce((a,x)=>a+x.count,0),p=pay(w,q);q.forEach(x=>pw[x.r]=(pw[x.r]||0)+(t?p*x.count/t:0))});
 const rows=D.r.map(r=>{const n=ds.filter(x=>x.r==r.id).reduce((a,x)=>a+x.count,0),rv=n*r.pp+ +r.flat,c=+r.fuel+ +r.tax+ +r.veh+ +r.oth,s=pw[r.id]||0,pr=rv-c-s;N+=n;rev+=rv;cost+=c;sal+=s;T+=pr;return{r,n,rv,c,s,pr}});return{T,N,rev,charges:cost+sal,rows}}
function sheet(title,F,cb,label="Enregistrer"){m.innerHTML=`<div class=bg onclick="if(event.target==this)m.innerHTML=''"><div class=sh><h2>${title}</h2>${F.map(f=>`<label>${f.l}</label>`+(f.o?`<select id=f_${f.k}>${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`:`<input id=f_${f.k} type=${f.t||"text"} ${f.t=="number"?"inputmode=decimal step=any":""} value="${esc(f.v??"")}">`)).join("")}<button class=btn id=go>${label}</button><button class="btn s" onclick="m.innerHTML=''">Annuler</button></div></div>`;
 $("#go").onclick=()=>{const o={};F.forEach(f=>o[f.k]=$("#f_"+f.k).value);if(cb(o)!==false)m.innerHTML=""}}
function draw(){if(!P.mode){nav.innerHTML="";app.innerHTML=`<div class=hero2><div class=hi>📰</div><h1>Journaux</h1><p>Livraisons, paie et rentabilité,<br>simplement.</p><button class=btn onclick="setMode('admin')">Je suis le patron</button><button class="btn s" onclick="setMode('worker')">Je suis salarié</button></div>`;return}
 const adm=P.mode=="admin",pe=D.d.filter(x=>x.st=="p").length;
 app.innerHTML=`<header><b>${adm?"Bonjour 👋":"Bonjour "+esc(P.name)}</b><span id=sy style="font-size:18px;margin-left:auto;margin-right:10px">${typeof syncBadge=="function"?syncBadge():""}</span><button class=g onclick="more()">⚙️</button></header><main id=v></main>`;
 if(adm){const T=[["home","🏠","Accueil"],["val","✅","Valider"+(pe?" ("+pe+")":"")],0,["team","👥","Équipe"],["rt","🛣️","Tournées"]];
  nav.innerHTML=T.map(t=>t?`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';draw()"><span>${t[1]}</span>${t[2]}</button>`:`<button class=fab onclick="addD()">+</button>`).join("")}
 else{tab="dec";nav.innerHTML=`<button class=fab style="margin:-30px auto 0" onclick="decl()">+</button>`}
 V[tab]();scrollTo(0,0)}
function setMode(md){if(md=="admin"){P.mode="admin";sv();draw()}else sheet("Comment vous appelez-vous ?",[{k:"n",l:"Votre nom (le patron vous reconnaîtra)"}],o=>{if(!o.n.trim())return false;P.mode="worker";P.name=o.n.trim();sv();draw()},"Continuer")}
const mv=k=>{const d=new Date(month+"-15");d.setMonth(d.getMonth()+k);month=iso(d).slice(0,7);draw()};
const empty=(i,t,s,b)=>`<div class="card empty"><div class=hi>${i}</div><h2>${t}</h2>${s}${b?`<button class=btn onclick="${b[1]}">${b[0]}</button>`:""}</div>`;
const V={
home(){if(!D.w.length||!D.r.length){v.innerHTML=empty("🚀","Configurons votre activité","Deux étapes et c'est parti : ajoutez vos tournées, puis vos salariés.<br><br>"+(D.r.length?"✅ Tournées":"1. Créer une tournée")+" · "+(D.w.length?"✅ Salariés":"2. Ajouter un salarié"),D.r.length?["Ajouter un salarié","eW()"]:["Créer ma première tournée","eR()"]);return}
 const S=stats(month),pe=D.d.filter(x=>x.st=="p").length,ml=new Date(month+"-15").toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
 const days=[6,5,4,3,2,1,0].map(i=>ago(i)),cn=days.map(d=>D.d.filter(x=>x.day==d&&x.st!="ko").reduce((a,x)=>a+x.count,0)),mx=Math.max(1,...cn);
 v.innerHTML=`<div class=hero><div class=mo><button onclick="mv(-1)">‹</button><span>${ml}</span><button onclick="mv(1)">›</button></div><small>Résultat du mois</small><div class="huge ${S.T<0?"neg":"pos"}">${eur(S.T)}</div><div class=kp><div><b>${S.N}</b><small>journaux</small></div><div><b>${eur(S.rev)}</b><small>revenus</small></div><div><b>${eur(S.charges)}</b><small>charges</small></div></div></div>
 ${pe?`<div class=warn onclick="tab='val';draw()">📥 ${pe} déclaration${pe>1?"s":""} à valider ›</div>`:""}
 <h3>7 derniers jours</h3><div class=card><div class=bars>${cn.map((c,i)=>`<div><i style="height:${Math.round(c/mx*70)}px"></i>${c||""}<br>${["D","L","M","M","J","V","S"][new Date(days[i]+"T12:00").getDay()]}</div>`).join("")}</div></div>
 <h3>Rentabilité par tournée</h3>`+S.rows.map(x=>`<div class=card><div class=sp><b>${esc(x.r.name)}</b><span class="pill ${x.pr<0?"ko":"ok"}">${eur(x.pr)}</span></div><small>${x.n} journaux · revenus ${eur(x.rv)} · salaires ${eur(x.s)} · coûts ${eur(x.c)}</small></div>`).join("")+
 `<h3>Paie du mois</h3><div class=card>`+D.w.map(w=>{const q=okM(month,w.id);return `<div class="ent" style="margin:8px 0">${av(w.name)}<div><b>${esc(w.name)}</b><br><small>${q.reduce((a,x)=>a+x.count,0)} journaux</small></div><b class=big>${eur(pay(w,q))}</b></div>`}).join("")+`</div>`},
val(){const p=D.d.filter(x=>x.st=="p");v.innerHTML=`<button class="btn s" onclick="imp()" style="margin-top:12px">📥 Importer le code d'un salarié</button>`+(p.length?`<button class="btn v" onclick="allOk()">Tout valider (${p.length})</button>`:empty("🎉","Tout est à jour","Aucune déclaration en attente."))+p.map(x=>`<div class=card><div class=ent>${av(W(x.w).name)}<div><b>${esc(W(x.w).name)}</b><br><small>${fmt(x.day)} · ${esc(R(x.r).name)}</small></div><span class=big>${x.count}</span></div><div class=row><button class="btn v" onclick="st('${x.id}','ok')">Valider</button><button class="btn s" onclick="fix('${x.id}')">Corriger</button><button class="btn k" onclick="st('${x.id}','ko')">Refuser</button></div></div>`).join("")},
team(){v.innerHTML=(D.w.length?"":empty("👥","Aucun salarié","Ajoutez les personnes qui livrent pour vous."))+D.w.map(w=>{const q=okM(month,w.id);return `<div class=card><div class=ent>${av(w.name)}<div><b>${esc(w.name)}</b><br><small>${eur2(w.rate)} ${RT[w.rt]}</small></div><b>${eur(pay(w,q))}</b></div><div class=row><button class="btn s" onclick="eW('${w.id}')">Modifier</button><button class="btn s" onclick="dW('${w.id}')">Supprimer</button></div></div>`}).join("")+`<button class=btn onclick="eW()">+ Ajouter un salarié</button>`},
rt(){v.innerHTML=(D.r.length?"":empty("🛣️","Aucune tournée","Une tournée = un parcours de livraison avec ses revenus et ses coûts."))+D.r.map(r=>`<div class=card><b>${esc(r.name)}</b><br><small>Facturé ${eur2(r.pp)} par journal${r.flat?" + forfait "+eur(r.flat):""}<br>Par mois : gasoil ${eur(r.fuel)} · impôts ${eur(r.tax)} · véhicule ${eur(r.veh)} · autres ${eur(r.oth)}</small><div class=row><button class="btn s" onclick="eR('${r.id}')">Modifier</button><button class="btn s" onclick="dR('${r.id}')">Supprimer</button></div></div>`).join("")+`<button class=btn onclick="eR()">+ Ajouter une tournée</button>`},
dec(){const l=P.d.slice().sort((a,b)=>b.day.localeCompare(a.day)||0).slice(0,40),ns=P.d.filter(x=>!P.sent.includes(x.id)).length,td=P.d.filter(x=>x.day==today()).reduce((a,x)=>a+x.c,0),mo=P.d.filter(x=>x.day.startsWith(month)).reduce((a,x)=>a+x.c,0);
 v.innerHTML=`<div class=hero><small>Aujourd'hui</small><div class=huge>${td}</div><div class=kp><div><b>${mo}</b><small>ce mois-ci</small></div><div><b>${P.d.length}</b><small>déclarations</small></div></div></div>

async function sb(path,o={},a){const go=()=>fetch(SB+path,{...o,headers:{...hdr(a),...(o.headers||{})}});let r=await go();if(r.status==401&&a&&SES&&await refreshTok())r=await go();return r}
async function refreshTok(){try{const r=await fetch(SB+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SK,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SES.refresh_token})});if(!r.ok){SES=null;LS.setItem("ses","null");return false}SES=await r.json();LS.setItem("ses",JSON.stringify(SES));return true}catch(e){return false}}
async function doLogin(email,pw){let r;try{r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SK,"Content-Type":"application/json"},body:JSON.stringify({email,password:pw})})}catch(e){throw new Error("Pas de connexion internet")}
 const j=await r.json();if(!r.ok)throw new Error(r.status==400?"E-mail ou mot de passe incorrect":(j.error_description||j.msg||"Connexion impossible"));SES=j;LS.setItem("ses",JSON.stringify(j))}
function loginScreen(){nav.innerHTML="";app.innerHTML=`<div class=hero2 style="padding:56px 22px"><div class=hi>🔐</div><h1>Connexion</h1><p>Espace patron</p><div style="text-align:left"><label>E-mail</label><input id=le type=email autocomplete=username value="${esc(LS.getItem("em")||"")}"><label>Mot de passe</label><input id=lp type=password autocomplete=current-password></div><button class=btn id=lb onclick="goLogin()">Se connecter</button><p id=lerr class=ko></p><button class="btn s" onclick="LS.setItem('localonly','1');draw()">Continuer sans synchronisation</button></div>`}
async function goLogin(){const e=$("#le").value.trim(),p=$("#lp").value;if(!e||!p){$("#lerr").textContent="Saisissez l'e-mail et le mot de passe";return}$("#lb").textContent="Connexion…";
 try{await doLogin(e,p);LS.setItem("em",e);draw();pull(true);startPoll()}catch(x){$("#lb").textContent="Se connecter";$("#lerr").textContent=x.message||"Connexion impossible"}}
function startPoll(){if(POLL)return;POLL=setInterval(()=>{if(!document.hidden)pull()},60000)}
function norm(d){["w","r","d","co","ab","pm","en"].forEach(k=>d[k]=d[k]||[]);if(d.goal===undefined)d.goal=0;return d}
function syncPush(){if(P.mode!="admin"||!SES||!SB_ON())return;clearTimeout(pushT);pushT=setTimeout(doPush,1500)}
async function doPush(){try{SYNC="busy";hdrSync();const r=await sb("/rest/v1/app_state?on_conflict=id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:"main",data:D,updated_at:new Date().toISOString()})},true);SYNC=r.ok?"ok":"err"}catch(e){SYNC="off"}hdrSync()}
async function pull(){if(P.mode!="admin"||!SES||!SB_ON()||pulling)return;pulling=true;
 try{const r=await sb("/rest/v1/app_state?id=eq.main&select=data",{},true);if(!r.ok)throw 0;const a=await r.json();
  if(!a.length)await doPush();else{const rd=a[0].data||{};if((rd._ts||0)>(D._ts||0)&&!m.innerHTML){D=norm(rd);LS.setItem("db",JSON.stringify(D));SYNC="ok";draw()}else if((D._ts||0)>(rd._ts||0))await doPush();else SYNC="ok"}
  await fetchDecl()}catch(e){SYNC="off"}pulling=false;hdrSync()}
async function fetchDecl(){const r=await sb("/rest/v1/declarations?imported=eq.false&select=id,worker_name,route_name,day,count&order=created_at.asc&limit=500",{},true);if(!r.ok)return;const a=await r.json();if(!a.length)return;
 const low=s=>String(s).trim().toLowerCase(),done=[];let n=0,who="";
 a.forEach(x=>{if(D.d.some(y=>y.id==x.id)){done.push(x.id);return}let w=D.w.find(y=>low(y.name)==low(x.worker_name));if(!w){w={id:uid(),name:String(x.worker_name).trim(),rt:"paper",rate:0,jours:[...JD],cree:today()};D.w.push(w)}
  let rt=D.r.find(y=>low(y.name)==low(x.route_name));if(!rt){rt={id:uid(),name:String(x.route_name).trim(),wid:"",vol:0,pp:0};D.r.push(rt)}
  D.d.push({id:x.id,w:w.id,r:rt.id,day:x.day,count:x.count,st:"p"});done.push(x.id);n++;who=w.name});
 sv();for(const id of done)await sb("/rest/v1/declarations?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({imported:true})},true);
 if(n){draw();toast(n+" nouvelle(s) déclaration(s)"+(n==1?" de "+who:""))}}
async function sendSb(silent){if(!SB_ON()||P.mode!="worker")return;const todo=P.d.filter(x=>!P.sent.includes(x.id));if(!todo.length)return;let ok=0,fail=0;
 for(const x of todo){x.u=x.u||uuid();try{const r=await fetch(SB+"/rest/v1/declarations",{method:"POST",headers:{apikey:SK,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({id:x.u,worker_name:P.name,route_name:x.r,day:x.day,count:x.c})});if(r.ok||r.status==409){P.sent.push(x.id);ok++}else fail++}catch(e){fail++}}
 sv();draw();if(!silent||ok)toast(fail?ok+" envoyée(s), "+fail+" en attente (pas de réseau ?)":"Envoyé au patron ✓")}
function send(){if(SB_ON()){sendSb(false);return}const j=JSON.stringify({n:P.name,d:P.d.slice(-300).map(x=>({i:x.id,day:x.day,r:x.r,c:x.c}))}),msg="Mes déclarations de livraison :\nJRN1:"+btoa(unescape(encodeURIComponent(j))),done=()=>{P.sent=P.d.map(x=>x.id);sv();draw()};navigator.share?navigator.share({text:msg}).then(done).catch(()=>{}):(cp(msg),done())}
function logout(){ask("Se déconnecter ?",()=>{SES=null;LS.setItem("ses","null");m.innerHTML="";draw()})}
const _draw=draw;draw=function(){if(P.mode=="admin"&&SB_ON()&&!SES){loginScreen();return}_draw()};
const _more=more;more=function(){_more();if(P.mode=="admin"&&SB_ON()&&SES)m.innerHTML=m.innerHTML.replace('<p class=m','<button class="btn s" onclick="m.innerHTML=\'\';pull();toast(\'Synchronisation…\')">🔄 Synchroniser maintenant</button><button class="btn s" onclick="logout()">Se déconnecter ('+esc(LS.getItem("em")||"patron")+')</button><p class=m')};
const _v2=V.val;V.val=function(){_v2();if(SES&&SB_ON())v.innerHTML=`<button class="btn s" style="margin-top:12px" onclick="pull();toast('Actualisation…')">🔄 Actualiser les déclarations</button>`+v.innerHTML};
document.addEventListener("visibilitychange",()=>{if(!document.hidden){pull();sendSb(true)}});
if(P.mode=="admin"&&SES&&SB_ON()){pull();startPoll()}if(P.mode=="worker")sendSb(true);
draw()
</script></body></html>
